nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/kaninda/aggregator-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

container:
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  SPRING_PROFILES_ACTIVE: default
  SERVER_PORT: "8080"

config:
  enabled: false
  data: {}

autoscaling:
  enabled: false