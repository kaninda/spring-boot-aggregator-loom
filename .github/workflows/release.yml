name: Maven Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: master
        fetch-depth: 0
        token: ${{ secrets.RELEASE_PAT }}

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: maven
        server-id: github
        server-username: GITHUB_ACTOR
        server-password: GITHUB_TOKEN

    - name: Configure Git
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

    - name: Configure authenticated remote
      run: |
        git remote set-url origin https://x-access-token:${{ secrets.RELEASE_PAT }}@github.com/kaninda/spring-boot-aggregator-loom.git

    - name: Sync with remote
      run: |
        git checkout master
        git fetch origin
        git reset --hard origin/master

    - name: Run Maven release
      run: mvn -B release:clean release:prepare release:perform
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout latest tag
      run: |
        git fetch --tags
        TAG=$(git describe --tags --abbrev=0)
        git checkout $TAG
        echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

    - name: Extract release version from tag checkout
      run: |
        VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
        echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build user-service release image
      run: |
        mvn -pl user-service -am spring-boot:build-image \
          -Dspring-boot.build-image.imageName=ghcr.io/${{ github.repository_owner }}/user-service:${RELEASE_VERSION}

    - name: Push user-service release image
      run: docker push ghcr.io/${{ github.repository_owner }}/user-service:${RELEASE_VERSION}

    - name: Build order-service release image
      run: |
        mvn -pl order-service -am spring-boot:build-image \
          -Dspring-boot.build-image.imageName=ghcr.io/${{ github.repository_owner }}/order-service:${RELEASE_VERSION}

    - name: Push order-service release image
      run: docker push ghcr.io/${{ github.repository_owner }}/order-service:${RELEASE_VERSION}

    - name: Build loyalty-service release image
      run: |
        mvn -pl loyalty-service -am spring-boot:build-image \
          -Dspring-boot.build-image.imageName=ghcr.io/${{ github.repository_owner }}/loyalty-service:${RELEASE_VERSION}

    - name: Push loyalty-service release image
      run: docker push ghcr.io/${{ github.repository_owner }}/loyalty-service:${RELEASE_VERSION}

    - name: Build aggregator-service release image
      run: |
        mvn -pl aggregator-service -am spring-boot:build-image \
          -Dspring-boot.build-image.imageName=ghcr.io/${{ github.repository_owner }}/aggregator-service:${RELEASE_VERSION}

    - name: Push aggregator-service release image
      run: docker push ghcr.io/${{ github.repository_owner }}/aggregator-service:${RELEASE_VERSION}
